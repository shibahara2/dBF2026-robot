x-core-build: &core-build
  context: .
  dockerfile: docker/core.Dockerfile

services:
  mocks:
    image: dbf2026-robot-core:latest
    build: *core-build
    command: ["python", "run_mocks.py"]
    ports:
      - "5001:5001"
      - "5002:5002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5001/v1/commands/load-drink/status', timeout=2);
          request = urllib.request.Request('http://localhost:5002/api/v1/guide-robot/status', headers={'X-API-Key': 'healthcheck'});
          urllib.request.urlopen(request, timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    image: dbf2026-robot-core:latest
    build: *core-build
    environment:
      R2_BASE_URL: http://mocks:5001
      PF_BASE_URL: http://mocks:5002
      PF_API_KEY: ${PF_API_KEY:-compose-local}
    command: ["python", "run.py"]
    ports:
      - "5000:5000"
    depends_on:
      mocks:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  devcontainer:
    build:
      context: .
      dockerfile: docker/devcontainer.Dockerfile
      args:
        CORE_IMAGE: core
      additional_contexts:
        core: service:app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
    volumes:
      - .:/workspace
      - codex-home:/opt/codex-home
      - ./docker/codex-config.toml:/opt/codex-home/config.toml:ro
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  codex-home:
